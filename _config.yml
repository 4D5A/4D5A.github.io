# 4d5a.github.io — retired domain, redirect-only site.
#
# This repo no longer hosts real content. Every page here is a stub that
# instantly forwards visitors (and search engines, via rel=canonical) to the
# equivalent URL on failclosed.com. See ../MIGRATION-NOTES.md for background.

title: 4D5A (moved to FailClosed)
author: FailClosed

# Target domain every stub redirects to. Used by _layouts/redirect.html.
new_domain: "https://failclosed.com"

# Same permalink pattern as the old 4D5A.github.io site, so posts generated
# here land on the exact same old URLs.
permalink: /:year-:month-:day-:title/
markdown: kramdown

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "redirect"
  -
    scope:
      path: ""
    values:
      layout: "redirect"

exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - README.md
